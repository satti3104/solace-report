<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoLaCe 日報</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2f6;color:#172b40;margin:0}main{max-width:650px;margin:auto;padding:20px}section{background:white;border-radius:12px;padding:16px;margin:14px 0}h1{margin-bottom:0}h2{font-size:18px}label{display:block;margin:12px 0 4px}input,textarea,select,button{font:inherit;width:100%;padding:10px;border:1px solid #b9c6d2;border-radius:8px}textarea{min-height:70px}button{background:#184b70;color:white;margin:8px 0;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}small{color:#526579}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>SoLaCe</h1><p>日別営業報告</p><small>不明な項目は空欄で構いません。お客様の氏名など個人情報は入力しないでください。</small><form id="f"><section><h2>基本情報</h2><label>営業日</label><input name="営業日" type="date" required><label>担当者</label><input name="担当者" required></section><section><h2>営業実績・客層</h2><div class="grid" id="counts"></div></section><section><h2>来店目的・利用状況</h2><div id="details"></div></section><button>報告文を作成</button></form><section id="out" hidden><h2>報告内容</h2><pre id="report"></pre><button id="copy">コピー</button><button id="share">共有（LINEなど）</button><small id="status"></small></section><p><small>入力内容はこの端末にのみ保存されます。管理者への提出はLINE等で共有してください。</small></p></main><script>const f=document.querySelector('#f'),counts=['売上（円）','来店人数','来店組数','新規客（人）','リピーター（人）','学生（人）','社会人（人）','一人客（人）','グループ客（組）'],details=['主な来店目的','新規客の来店経路','混雑時間帯','滞在時間の傾向','人気ゲーム','飲食の注文傾向','お客様の反応・要望','営業の特徴・気になった点','改善案'];for(const n of counts){const d=document.createElement('div');d.innerHTML='<label>'+n+'</label><input type="number" min="0" step="1" name="'+n+'" placeholder="不明">';document.querySelector('#counts').append(d)}for(const n of details){const d=document.createElement('div');d.innerHTML='<label>'+n+'</label><textarea name="'+n+'" placeholder="不明"></textarea>';document.querySelector('#details').append(d)}f.elements['営業日'].value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());try{const saved=JSON.parse(localStorage.getItem('solaceDraft')||'null');if(saved)for(const [k,v] of Object.entries(saved))if(f.elements[k])f.elements[k].value=v}catch{}f.addEventListener('input',()=>{try{localStorage.setItem('solaceDraft',JSON.stringify(Object.fromEntries(new FormData(f))))}catch{}});let report='';f.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));report='【SoLaCe 日別営業報告】\n'+Object.entries(data).map(([k,v])=>k+'：'+(v.trim()||'不明')).join('\n');document.querySelector('#report').textContent=report;document.querySelector('#out').hidden=false;document.querySelector('#out').scrollIntoView({behavior:'smooth'})};async function copy(){try{await navigator.clipboard.writeText(report);document.querySelector('#status').textContent='コピーしました'}catch{document.querySelector('#status').textContent='報告文を長押ししてコピーしてください'}}document.querySelector('#copy').onclick=copy;document.querySelector('#share').onclick=async()=>{if(navigator.share){try{await navigator.share({text:report})}catch{}}else await copy()};</script></html>
