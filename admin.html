.stack{display:flex;height:18px;overflow:hidden;border-radius:8px;margin:12px 0}.chart-scroll{overflow-x:auto}.chart-scroll svg{display:block;width:100%;height:auto;max-height:280px}.comparison{margin:14px 0;padding:12px;border:1px solid #dce8e1;border-radius:12px}.comparison h3,.metric h3{margin:0 0 8px}.report-card summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.report-card summary::-webkit-details-marker{display:none}.report-card summary:after{content:'＋';color:#17604e}.report-card[open] summary:after{content:'−'}.report-card .report-kpi{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}.report-card .report-kpi strong{display:block;font-size:19px}.report-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.report-field{background:#f5f8f6;padding:10px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.report-field small{display:block;font-weight:700;margin-bottom:4px}@media(max-width:650px){.report-fields{grid-template-columns:1fr}.report-card .report-kpi{gap:10px}}</style><main><header><div class="eyebrow">SOLACE / MANAGEMENT</div><h1>営業ダッシュボード</h1><p>日別実績・客層・営業レポート</p></header><section id="import-panel"><details><summary>LINE日報取り込み（端末内の暫定集計）</summary><textarea id="raw" placeholder="【SoLaCe 日別営業報告】から始まる報告文を貼り付け"></textarea><button id="add">取り込み</button><p id="msg" role="status"></p></details></section><section><h2>集計期間</h2><div class="filters"><label>開始 <input type="date" id="start"></label><label>終了 <input type="date" id="end"></label></div><div id="summary"></div><h3>売上推移</h3><div id="trend" class="chart-scroll"></div><h3>客層構成グラフ</h3><div id="composition" class="metrics"></div><h3>期間比較</h3><div id="compare"></div><h3>曜日別</h3><div id="weekday" class="scroll"></div><div class="actions"><button id="csv">CSV出力</button></div></section><section><h2>日報一覧・所感</h2><div id="list"></div></section></main><script>const $=id=>document.getElementById(id),key='solaceAdminReportsV1',date='営業日',num=['売上（円）','来店人数','来店組数','新規客（人）','リピーター（人）','学生（人）','社会人（人）','一人客（人）','グループ客（組）'];let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))rows=[]}catch{}function save(next){try{localStorage.setItem(key,JSON.stringify(next));rows=next;return true}catch{$('msg').textContent='端末に保存できません';return false}}function value(r,k){const s=String(r[k]??'').trim();return /^\d+$/.test(s)&&Number.isSafeInteger(+s)?+s:null}function selected(){return rows.filter(r=>(!$('start').value||r[date]>=$('start').value)&&(!$('end').value||r[date]<=$('end').value)).sort((a,b)=>b[date].localeCompare(a[date]))}function sum(rs,k){let vs=rs.map(r=>value(r,k)).filter(v=>v!==null);return {n:vs.length,v:vs.reduce((a,b)=>a+b,0)}}function ratio(rs,a,b,m=1){let p=rs.filter(r=>value(r,a)!==null&&value(r,b)!==null);let den=sum(p,b).v;return den?(sum(p,a).v/den*m).toLocaleString('ja-JP',{maximumFractionDigits:1}):'―'}function el(tag,t,parent){let e=document.createElement(tag);e.textContent=t;parent.append(e);return e}

function trend(rs){let root=$('trend');root.replaceChildren();let pts=rs.filter(r=>value(r,num[0])!==null).sort((a,b)=>a[date].localeCompare(b[date]));if(!pts.length){el('p','売上データなし',root);return}let ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),W=Math.max(340,pts.length*24+80),H=220,top=15,bottom=180,left=65,right=W-18,max=Math.max(1,...pts.map(r=>value(r,num[0]))),first=Date.parse(pts[0][date]),last=Date.parse(pts.at(-1)[date]);svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.style.minWidth=W+'px';svg.setAttribute('role','img');svg.setAttribute('aria-label','日別売上推移');root.append(svg);function node(tag,attrs,t){let e=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(t!==undefined)e.textContent=t;svg.append(e);return e}for(let i=0;i<=4;i++){let y=bottom-(bottom-top)*i/4;node('line',{x1:left,x2:right,y1:y,y2:y,stroke:'#dde8e1'});node('text',{x:left-6,y:y+4,'text-anchor':'end','font-size':10,fill:'#587268'},Math.round(max*i/4).toLocaleString())}let xs=pts.map(r=>last===first?(left+right)/2:left+(right-left)*(Date.parse(r[date])-first)/(last-first)),ys=pts.map(r=>bottom-(bottom-top)*value(r,num[0])/max);node('polyline',{points:xs.map((x,i)=>x+','+ys[i]).join(' '),fill:'none',stroke:'#17604e','stroke-width':2.5});pts.forEach((r,i)=>{let e=node('circle',{cx:xs[i],cy:ys[i],r:4,fill:'#17604e'});let title=document.createElementNS(ns,'title');title.textContent=r[date]+' '+fmt(value(r,num[0]),'円');e.append(title);if(i===0||i===pts.length-1||i%Math.ceil(pts.length/6)===0)node('text',{x:xs[i],y:202,'text-anchor':'middle','font-size':10,fill:'#587268'},r[date].slice(5))});el('small','売上確認済みの日のみ表示。未報告日はゼロ扱いしません。',root)}

function compare(){let root=$('compare');root.replaceChildren();let anchor=$('end').value||new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}),d=new Date(anchor+'T00:00:00Z');if(!Number.isFinite(+d))return;let iso=x=>x.toISOString().slice(0,10),shift=(x,n)=>new Date(+x+n*86400000),week=shift(d,-(d.getUTCDay()+6)%7),month=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)),prevMonth=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1)),prevEnd=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,Math.min(d.getUTCDate(),new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),0)).getUTCDate())));function range(a,b){return rows.filter(r=>r[date]>=iso(a)&&r[date]<=iso(b))}function stats(p){let paired=p.filter(r=>value(r,num[0])!==null&&value(r,num[1])!==null),n=sum(paired,num[1]).v;return [sum(p,num[0]).n?sum(p,num[0]).v:null,sum(p,num[1]).n?sum(p,num[1]).v:null,n?sum(paired,num[0]).v/n:null]}for(let [title,a,b,c,e] of [['前週比較',week,d,shift(week,-7),shift(d,-7)],['前月比較',month,d,prevMonth,prevEnd]]){let p=range(a,b),q=range(c,e),x=stats(p),y=stats(q),box=el('div','',root);box.className='comparison';el('h3',title,box);el('small',iso(a)+'〜'+iso(b)+'（'+p.length+'日報） / '+iso(c)+'〜'+iso(e)+'（'+q.length+'日報）',box);let wrap=el('div','',box);wrap.className='scroll';let t=el('table','',wrap),h=el('tr','',t);for(let z of ['指標','今期','前期','増減','増減率'])el('th',z,h);['売上','客数','客単価'].forEach((k,i)=>{let tr=el('tr','',t),u=i===1?'人':'円',delta=x[i]===null||y[i]===null?null:x[i]-y[i];for(let z of [k,fmt(x[i],u),fmt(y[i],u),delta===null?'―':(delta>0?'+':'')+fmt(delta,u),delta===null||!y[i]?'―':(delta>0?'+':'')+fmt(delta/y[i]*100,'%')])el('td',z,tr)})}el('small','終了日（未指定は今日）を基準に、週・月の同経過期間を比較。開始日フィルターとは独立。未報告日は補完しません。',root)}
function render(){let rs=selected(),s=$('summary');s.replaceChildren();el('p','報告日数：'+rs.length+' 日',s).className='muted';let m=el('div','',s);m.className='metrics';function metric(label,v,sub,primary=false){let c=el('div','',m);c.className='metric'+(primary?' primary':'');el('span',label,c);el('strong',v,c);el('small',sub,c)}for(let k of num.slice(0,2)){let x=sum(rs,k);metric(k,x.n?x.v.toLocaleString()+(k===num[0]?' 円':' 人'):'―','確認 '+x.n+'/'+rs.length+' 日',true)}metric('客単価',ratio(rs,num[0],num[1])+' 円','両項目確認済みの日のみ',true);el('h3','客層・来店構成',s);m=el('div','',s);m.className='metrics';for(let k of num.slice(2)){let x=sum(rs,k);metric(k,x.n?x.v.toLocaleString():'―','確認 '+x.n+'/'+rs.length+' 日')}metric('新規率',ratio(rs,num[3],num[1],100)+' %','両項目確認済みの日のみ');metric('学生比率',ratio(rs,num[5],num[1],100)+' %','両項目確認済みの日のみ');if(!rs.length)el('p','対象期間の日報がありません。クラウドを取得するか、集計期間を確認してください。',s).className='muted';let w=$('weekday');w.replaceChildren();let t=el('table','',w);let h=el('tr','',t);for(let v of ['曜日','報告日','平均売上','平均客数'])el('th',v,h);for(let i of [1,2,3,4,5,6,0]){let p=rs.filter(r=>new Date(r[date]+'T00:00:00+09:00').toLocaleDateString('en-US',{weekday:'short',timeZone:'Asia/Tokyo'})===['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]);let tr=el('tr','',t);el('td','日月火水木金土'[i],tr);el('td',p.length,tr);for(let k of num.slice(0,2)){let x=sum(p,k);el('td',x.n?Math.round(x.v/x.n).toLocaleString():'―',tr)}}trend(rs);composition(rs);compare();let l=$('list');l.replaceChildren();if(!rs.length)el('p','表示できる日報はありません。',l).className='muted';for(let r of rs){let d=el('details','',l);d.className='report-card';let head=el('summary','',d),info=el('div','',head);el('strong',r[date]||'日付不明',info);el('small','　'+(r['担当者']||'担当者不明'),info);let kpi=el('div','',head);kpi.className='report-kpi';for(let [label,k,u] of [['売上',num[0],'円'],['来店',num[1],'人'],['新規',num[3],'人']]){let f=el('div','',kpi);el('small',label,f);el('strong',fmt(value(r,k),u),f)}let fields=el('div','',d);fields.className='report
