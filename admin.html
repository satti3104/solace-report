<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoLaCe 管理者集計</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2f6;color:#172b40;margin:0}main{max-width:900px;margin:auto;padding:20px}section{background:white;border-radius:12px;padding:16px;margin:14px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #b9c6d2;border-radius:8px}textarea{width:100%;min-height:130px}button{background:#184b70;color:white;border:0;margin:5px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526579}.scroll{overflow:auto}</style><main><h1>SoLaCe 管理者集計</h1><p>暫定版：LINE日報を貼り付けて集計。データはこの端末のみ保存。認証・クラウド連携は未設定。</p><section><h2>日報取り込み</h2><textarea id="raw" placeholder="【SoLaCe 日別営業報告】から始まる報告文を貼り付け"></textarea><button id="add">取り込み</button><p id="msg" role="status"></p></section><section><h2>集計期間</h2><label>開始 <input type="date" id="start"></label> <label>終了 <input type="date" id="end"></label><div id="summary"></div><h3>曜日別</h3><div id="weekday" class="scroll"></div><button id="csv">CSV出力</button></section><section><h2>日報一覧・所感</h2><div id="list"></div></section></main><script>const $=id=>document.getElementById(id),key='solaceAdminReportsV1',date='営業日',num=['売上（円）','来店人数','来店組数','新規客（人）','リピーター（人）','学生（人）','社会人（人）','一人客（人）','グループ客（組）'];let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))rows=[]}catch{}function save(next){try{localStorage.setItem(key,JSON.stringify(next));rows=next;return true}catch{$('msg').textContent='端末に保存できません';return false}}function value(r,k){const s=String(r[k]??'').trim();return /^\d+$/.test(s)&&Number.isSafeInteger(+s)?+s:null}function selected(){return rows.filter(r=>(!$('start').value||r[date]>=$('start').value)&&(!$('end').value||r[date]<=$('end').value)).sort((a,b)=>b[date].localeCompare(a[date]))}function sum(rs,k){let vs=rs.map(r=>value(r,k)).filter(v=>v!==null);return {n:vs.length,v:vs.reduce((a,b)=>a+b,0)}}function ratio(rs,a,b,m=1){let p=rs.filter(r=>value(r,a)!==null&&value(r,b)!==null);let den=sum(p,b).v;return den?(sum(p,a).v/den*m).toLocaleString('ja-JP',{maximumFractionDigits:1}):'―'}function el(tag,t,parent){let e=document.createElement(tag);e.textContent=t;parent.append(e);return e}function render(){let rs=selected(),s=$('summary');s.replaceChildren();el('p','報告日数：'+rs.length,s);for(let k of num){let x=sum(rs,k);el('p',k+'：'+(x.n?x.v.toLocaleString():'不明')+'（確認 '+x.n+'/'+rs.length+' 日）',s)}el('p','客単価：'+ratio(rs,num[0],num[1])+' 円／新規率：'+ratio(rs,num[3],num[1],100)+' %／学生比率：'+ratio(rs,num[5],num[1],100)+' %（両項目確認済みの日のみ）',s);let w=$('weekday');w.replaceChildren();let t=el('table','',w);let h=el('tr','',t);for(let v of ['曜日','報告日','平均売上','平均客数'])el('th',v,h);for(let i of [1,2,3,4,5,6,0]){let p=rs.filter(r=>new Date(r[date]+'T00:00:00+09:00').toLocaleDateString('en-US',{weekday:'short',timeZone:'Asia/Tokyo'})===['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]);let tr=el('tr','',t);el('td','日月火水木金土'[i],tr);el('td',p.length,tr);for(let k of num.slice(0,2)){let x=sum(p,k);el('td',x.n?Math.round(x.v/x.n).toLocaleString():'―',tr)}}let l=$('list');l.replaceChildren();for(let r of rs){let d=el('details','',l);el('summary',r[date]+' '+r['担当者'],d);el('pre',Object.entries(r).map(([k,v])=>k+'：'+v).join('\n'),d)}}$('add').onclick=()=>{let raw=$('raw').value.trim(),r={},last='';if(!raw.startsWith('【SoLaCe 日別営業報告】')){$('msg').textContent='日報形式を確認してください';return}let allowed=[date,'担当者',...num,'主な来店目的','新規客の来店経路','混雑時間帯','滞在時間の傾向','人気ゲーム','飲食の注文傾向','お客様の反応・要望','営業の特徴・気になった点','改善案'];for(let line of raw.split(/\r?\n/).slice(1)){let i=line.indexOf('：'),k=line.slice(0,i);if(i>0&&allowed.includes(k)){last=k;r[k]=line.slice(i+1)}else if(last)r[last]+='\n'+line}if(!/^\d{4}-\d{2}-\d{2}$/.test(r[date]||'')||!r['担当者']){$('msg').textContent='営業日・担当者を確認してください';return}if(rows.some(x=>x[date]===r[date])&&!confirm('同日の報告を置き換えますか？'))return;if(save([...rows.filter(x=>x[date]!==r[date]),r])){$('raw').value='';$('msg').textContent='取り込み完了';render()}};$('start').onchange=$('end').onchange=render;$('csv').onclick=()=>{let rs=selected(),ks=[...new Set(rs.flatMap(Object.keys))];if(!rs.length)return;let q=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"',blob=new Blob(['\ufeff'+[ks.map(q).join(','),...rs.map(r=>ks.map(k=>q(r[k])).join(','))].join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='solace-reports.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></html>
