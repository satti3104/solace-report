<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoLaCe 管理者集計</title><style>
*{box-sizing:border-box}body{font:15px/1.6 system-ui,-apple-system,sans-serif;background:#f3f6f5;color:#19352f;margin:0}main{max-width:1180px;margin:auto;padding:24px}header{background:#123e34;color:white;padding:28px;border-radius:18px;margin:0 0 20px}header p{color:#c4ded5;margin:4px 0}h1{font-size:clamp(24px,4vw,36px);margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:24px 0 10px}section{background:white;border:1px solid #dfe8e3;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #15382c08}input,textarea,button{font:inherit;padding:11px 13px;border:1px solid #b9cbc2;border-radius:9px}input{max-width:100%;background:#fafcfb}textarea{width:100%;min-height:130px}button{background:#17604e;color:white;border:0;margin:5px;cursor:pointer;font-weight:600}button:hover{background:#104738}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #6abfa4;outline-offset:2px}table{width:100%;border-collapse:collapse;min-width:390px;font-variant-numeric:tabular-nums}td,th{text-align:right;padding:12px;border-bottom:1px solid #e4ebe7}td:first-child,th:first-child{text-align:left}th{background:#eff5f1;color:#456458}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f5f8f6;padding:14px;border-radius:10px}small,.muted{color:#587268}.scroll{overflow:auto}.eyebrow{font-size:11px;letter-spacing:.17em;font-weight:700;color:#a9d6c7}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.filters label{display:grid;gap:4px;font-size:13px;font-weight:600}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.metric{border:1px solid #dce8e1;border-radius:12px;padding:14px;background:#f7faf8;min-width:0}.metric.primary{background:#e6f3ed;border-color:#c6e1d3}.metric strong{display:block;font-size:clamp(19px,3vw,30px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.25;margin:6px 0}.metric small{display:block;font-size:11px}.bar{height:7px;background:#e4eee8;border-radius:8px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#409c7b;border-radius:8px}details{border:1px solid #dce8e1;border-radius:10px;margin:9px 0;padding:12px}summary{cursor:pointer;font-weight:650}#dbstatus,#msg{font-size:13px;color:#456458;overflow-wrap:anywhere}#dbemail,#dbpass{margin:4px 8px 4px 4px}#dbstatus:empty,#msg:empty{display:none}.actions{display:flex;justify-content:flex-end;flex-wrap:wrap}#import-panel summary{font-size:17px}#import-panel textarea{margin-top:14px}@media(max-width:650px){main{padding:12px}header{padding:20px}section{padding:15px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:11px}#dbemail,#dbpass{display:block;width:100%;margin:4px 0 10px}.filters label{flex:1;min-width:125px}.filters input{width:100%}button{min-height:44px}}
</style><main><header><div class="eyebrow">SOLACE / MANAGEMENT</div><h1>営業ダッシュボード</h1><p>日別実績・客層・営業レポート</p></header><section id="import-panel"><details><summary>LINE日報取り込み（端末内の暫定集計）</summary><textarea id="raw" placeholder="【SoLaCe 日別営業報告】から始まる報告文を貼り付け"></textarea><button id="add">取り込み</button><p id="msg" role="status"></p></details></section><section><h2>集計期間</h2><div class="filters"><label>開始 <input type="date" id="start"></label><label>終了 <input type="date" id="end"></label></div><div id="summary"></div><h3>曜日別</h3><div id="weekday" class="scroll"></div><div class="actions"><button id="csv">CSV出力</button></div></section><section><h2>日報一覧・所感</h2><div id="list"></div></section></main><script>const $=id=>document.getElementById(id),key='solaceAdminReportsV1',date='営業日',num=['売上（円）','来店人数','来店組数','新規客（人）','リピーター（人）','学生（人）','社会人（人）','一人客（人）','グループ客（組）'];let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(rows))rows=[]}catch{}function save(next){try{localStorage.setItem(key,JSON.stringify(next));rows=next;return true}catch{$('msg').textContent='端末に保存できません';return false}}function value(r,k){const s=String(r[k]??'').trim();return /^\d+$/.test(s)&&Number.isSafeInteger(+s)?+s:null}function selected(){return rows.filter(r=>(!$('start').value||r[date]>=$('start').value)&&(!$('end').value||r[date]<=$('end').value)).sort((a,b)=>b[date].localeCompare(a[date]))}function sum(rs,k){let vs=rs.map(r=>value(r,k)).filter(v=>v!==null);return {n:vs.length,v:vs.reduce((a,b)=>a+b,0)}}function ratio(rs,a,b,m=1){let p=rs.filter(r=>value(r,a)!==null&&value(r,b)!==null);let den=sum(p,b).v;return den?(sum(p,a).v/den*m).toLocaleString('ja-JP',{maximumFractionDigits:1}):'―'}function el(tag,t,parent){let e=document.createElement(tag);e.textContent=t;parent.append(e);return e}function render(){let rs=selected(),s=$('summary');s.replaceChildren();el('p','報告日数：'+rs.length+' 日',s).className='muted';let m=el('div','',s);m.className='metrics';function metric(label,v,sub,primary=false){let c=el('div','',m);c.className='metric'+(primary?' primary':'');el('span',label,c);el('strong',v,c);el('small',sub,c)}for(let k of num.slice(0,2)){let x=sum(rs,k);metric(k,x.n?x.v.toLocaleString()+(k===num[0]?' 円':' 人'):'―','確認 '+x.n+'/'+rs.length+' 日',true)}metric('客単価',ratio(rs,num[0],num[1])+' 円','両項目確認済みの日のみ',true);el('h3','客層・来店構成',s);m=el('div','',s);m.className='metrics';for(let k of num.slice(2)){let x=sum(rs,k);metric(k,x.n?x.v.toLocaleString():'―','確認 '+x.n+'/'+rs.length+' 日')}metric('新規率',ratio(rs,num[3],num[1],100)+' %','両項目確認済みの日のみ');metric('学生比率',ratio(rs,num[5],num[1],100)+' %','両項目確認済みの日のみ');if(!rs.length)el('p','対象期間の日報がありません。クラウドを取得するか、集計期間を確認してください。',s).className='muted';let w=$('weekday');w.replaceChildren();let t=el('table','',w);let h=el('tr','',t);for(let v of ['曜日','報告日','平均売上','平均客数'])el('th',v,h);for(let i of [1,2,3,4,5,6,0]){let p=rs.filter(r=>new Date(r[date]+'T00:00:00+09:00').toLocaleDateString('en-US',{weekday:'short',timeZone:'Asia/Tokyo'})===['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]);let tr=el('tr','',t);el('td','日月火水木金土'[i],tr);el('td',p.length,tr);for(let k of num.slice(0,2)){let x=sum(p,k);el('td',x.n?Math.round(x.v/x.n).toLocaleString():'―',tr)}}let l=$('list');l.replaceChildren();if(!rs.length)el('p','表示できる日報はありません。',l).className='muted';for(let r of rs){let d=el('details','',l);el('summary',r[date]+' '+r['担当者'],d);el('pre',Object.entries(r).map(([k,v])=>k+'：'+v).join('\n'),d)}}$('add').onclick=()=>{let raw=$('raw').value.trim(),r={},last='';if(!raw.startsWith('【SoLaCe 日別営業報告】')){$('msg').textContent='日報形式を確認してください';return}let allowed=[date,'担当者',...num,'主な来店目的','新規客の来店経路','混雑時間帯','滞在時間の傾向','人気ゲーム','飲食の注文傾向','お客様の反応・要望','営業の特徴・気になった点','改善案'];for(let line of raw.split(/\r?\n/).slice(1)){let i=line.indexOf('：'),k=line.slice(0,i);if(i>0&&allowed.includes(k)){last=k;r[k]=line.slice(i+1)}else if(last)r[last]+='\n'+line}if(!/^\d{4}-\d{2}-\d{2}$/.test(r[date]||'')||!r['担当者']){$('msg').textContent='営業日・担当者を確認してください';return}if(rows.some(x=>x[date]===r[date])&&!confirm('同日の報告を置き換えますか？'))return;if(save([...rows.filter(x=>x[date]!==r[date]),r])){$('raw').value='';$('msg').textContent='取り込み完了';render()}};$('start').onchange=$('end').onchange=render;$('csv').onclick=()=>{let rs=selected(),ks=[...new Set(rs.flatMap(Object.keys))];if(!rs.length)return;let q=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"',blob=new Blob(['\ufeff'+[ks.map(q).join(','),...rs.map(r=>ks.map(k=>q(r[k])).join(','))].join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='solace-reports.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script><script src="cloud.js"></script><script>const refresh=document.createElement('button');refresh.textContent='クラウド日報を更新';loginBox.append(refresh);document.querySelector('main').insertBefore(document.querySelector('header'),loginBox);document.querySelector('main').append(document.getElementById('import-panel'));async function onDbLogin(){if(session?.user?.app_metadata?.solace_role!=='admin'){session=null;throw Error('管理者権限が必要です')}let all=[],offset=0;while(true){let batch=await request('/rest/v1/solace_daily_reports?select=business_date,payload&order=business_date.desc&limit=500&offset='+offset);all.push(...batch);if(batch.length<500)break;offset+=500}rows=all.map(x=>({...x.payload,'営業日':x.business_date}));render();dbStatus('クラウド日報 '+rows.length+' 件取得済み')}refresh.onclick=async()=>{try{if(!session)throw Error('管理者ログインが必要です');await onDbLogin()}catch(e){dbStatus(e.message)}};</script></html>
